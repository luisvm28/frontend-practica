name: Frontend Practica

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: frontend-practica
  IMAGE_TAG: v1.0.0-practica
  DOCKER_REGISTRY: toposx28

jobs:
  build:
    runs-on: ubuntu-latest
    steps:    
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: login to dockerhub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build + Push
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
        build-args: |
          APP_ENV=${{ secrets.APP_ENV }}
            
  test:
    name: Run tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run test
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npm run test

  codeScan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      - name: Get SonarCloud status
        run: |
          echo "SONAR_STATUS=$(curl -s -u ${{ secrets.SONAR_TOKEN}}: https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECT_KEY }} | jq -r '.projectStatus.status')" >> $GITHUB_ENV

      - name: Sonar Status
        run: echo ${{ env.SONAR_STATUS }}

      - name: Check Status
        if: ${{ env.SONAR_STATUS == 'ERROR' }}
        run: echo "Problemas de seguridad encontrados... "

security-SNYK:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Run Snyk to check critical issues
        uses: snyk/actions/node@master # Acción agregada
        continue-on-error: true # Permite que el pipeline siga aunque Snyk encuentre vulnerabilidades, para poder subir el reporte
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # Se agrega el comando para generar el archivo JSON que necesitas
          args: --severity-threshold=critical --json-file-output=snyk-results.json
  
      - name: Exportar resultados de Snyk como artefactos
        uses: actions/upload-artifact@v4 # Guion agregado para convertirlo en lista
        if: always()
        with:
          name: Snyk-Vulnerability-Report
          path: snyk-results.json
          retention-days: 14